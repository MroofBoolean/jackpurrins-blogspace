theme: jekyll-theme-chirpy
lang: en
timezone: America/Phoenix
title: jackpurrin's blogspace # the main title
tagline:
description: >- # used by seo meta and the atom feed
  this is a small blog by a nerd who likes coding and sometimes writing.
url: "https://blogspace.jackpurrin.me"
github:
  username: jackpurrin
twitter:
  username:
social:
  name: jackpurrin
  email: me@jackpurrin.me
  links:
    - https://bsky.app/profile/jackpurrin.me
    - https://github.com/jackpurrin
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id: # fill in your Cloudflare Web Analytics token
  fathom:
    id:
pageviews:
  provider:
theme_mode:
cdn:
avatar: /assets/images/puro.jpg
social_preview_image:
toc: true
comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:
assets:
  self_host:
    enabled:
    env:
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:
paginate: 10
baseurl: ""
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
collections:
  tabs:
    output: true
    sort_by: order
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
sass:
  style: compressed
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - rollup.config.js
  - "package*.json"
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
